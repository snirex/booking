<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עין שמר - מערכת הזמנת מחשבים</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #f8f9fa;
            --text-main: #212529;
            --card-bg: #ffffff;
            --navbar-bg: #ffffff;
            --border-color: #dee2e6;
            --shadow: 0 .125rem .25rem rgba(0,0,0,.075);
            --modal-bg: #ffffff;
        }
        [data-theme="dark"] {
            --bg-body: #121212;
            --text-main: #e0e0e0;
            --card-bg: #1e1e1e;
            --navbar-bg: #1e1e1e;
            --border-color: #333;
            --shadow: 0 .125rem .25rem rgba(255,255,255,.05);
            --modal-bg: #2d2d2d;
        }

        body { background-color: var(--bg-body); color: var(--text-main); transition: background-color 0.3s, color 0.3s; }
        .navbar { background-color: var(--navbar-bg) !important; border-bottom: 1px solid var(--border-color); }
        .card { background-color: var(--card-bg); border-color: var(--border-color); color: var(--text-main); }
        .modal-content { background-color: var(--modal-bg); color: var(--text-main); }
        .computer-card { transition: transform 0.2s; cursor: pointer; border-radius: 12px; }
        .computer-card:hover { transform: translateY(-3px); }
        .status-free { border-top: 5px solid #198754; }
        .status-taken { border-top: 5px solid #dc3545; opacity: 0.9; }
        .date-scroller { overflow-x: auto; white-space: nowrap; padding-bottom: 10px; }
        .date-btn { display: inline-block; width: 100px; margin-left: 5px; }
        .date-btn.active { background-color: #0d6efd; color: white; }
        
        #mojoauth-passwordless-form { margin-top: 20px; }
    </style>
</head>
<body>

    <div x-data="bookingApp()" x-init="initApp()">
        
        <nav class="navbar navbar-expand-lg shadow-sm mb-4 px-3">
            <a class="navbar-brand fw-bold" href="#" :class="darkMode ? 'text-light' : 'text-dark'">
                <i class="fas fa-laptop-code text-primary"></i> עין שמר - הזמנת מחשבים
            </a>
            <div class="ms-auto d-flex gap-2">
                <button @click="toggleDarkMode()" class="btn btn-sm btn-outline-secondary">
                    <i class="fas" :class="darkMode ? 'fa-sun' : 'fa-moon'"></i>
                </button>
                <button @click="showAdminModal = true" class="btn btn-sm" 
                        :class="adminModeActive ? 'btn-warning text-dark fw-bold' : 'btn-outline-secondary'">
                    <i class="fas fa-cog"></i> 
                    <span x-text="adminModeActive ? 'מחובר כמנהל' : 'ניהול'"></span>
                </button>
            </div>
        </nav>

        <div class="container py-2">
            <div x-show="isLoading" class="text-center py-5">
                <div class="spinner-border text-primary"></div>
                <p class="mt-2">מתחבר לענן של עין שמר...</p>
            </div>

            <div x-show="!isLoading" x-cloak>
                <div class="mb-4">
                    <h5 class="mb-3">בחר תאריך:</h5>
                    <div class="date-scroller">
                        <template x-for="dateObj in availableDates" :key="dateObj.value">
                            <button class="btn btn-outline-primary date-btn" 
                                    :class="{ 'active': selectedDate === dateObj.value }"
                                    @click="selectedDate = dateObj.value">
                                <div class="fw-bold" x-text="dateObj.dayName"></div>
                                <div class="small" x-text="dateObj.formatted"></div>
                            </button>
                        </template>
                    </div>
                </div>

                <div class="alert alert-info d-flex justify-content-between align-items-center">
                    <div>
                        <i class="fas fa-calendar-day"></i> תאריך: <strong x-text="formatDate(selectedDate)"></strong>
                    </div>
                    <span class="badge bg-primary" x-text="getAvailabilityText()"></span>
                </div>

                <div class="row g-3">
                    <template x-for="i in settings.totalComputers" :key="i">
                        <div class="col-6 col-md-4 col-lg-3">
                            <div class="card computer-card h-100 shadow-sm"
                                 :class="isBooked(i) ? 'status-taken' : 'status-free'"
                                 @click="handleCardClick(i)">
                                <div class="card-body text-center">
                                    <h5 class="card-title">מחשב <span x-text="i"></span></h5>
                                    
                                    <template x-if="isBooked(i)">
                                        <div>
                                            <div class="text-danger small"><i class="fas fa-lock"></i> תפוס: <span x-text="getBookingDetails(i).name"></span></div>
                                            <button x-show="adminModeActive" @click.stop="adminRemoveBooking(i)" class="btn btn-sm btn-danger mt-2 w-100">מחק (מנהל)</button>
                                            <button x-show="!adminModeActive" @click.stop="startCancellation(i)" class="btn btn-sm btn-link text-danger mt-1">ביטול</button>
                                        </div>
                                    </template>
                                    
                                    <template x-if="!isBooked(i)">
                                        <div class="text-success"><i class="fas fa-check-circle"></i> פנוי</div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <div class="modal fade" id="bookingModal" tabindex="-1" x-ref="bookingModalElement">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">הזמנת מחשב מס' <span x-text="currentComputerId"></span></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div x-show="bookingStep === 1">
                            <form @submit.prevent="moveToOtp()">
                                <div class="mb-3">
                                    <label class="form-label">שם מלא</label>
                                    <input type="text" class="form-control" x-model="bookingForm.name" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">דואר אלקטרוני</label>
                                    <input type="email" class="form-control" x-model="bookingForm.email" required>
                                    <div class="form-text small" x-show="!adminModeActive">הגבלה: עד <span x-text="settings.maxBookingsPerWeek"></span> הזמנות בשבוע.</div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">טלפון</label>
                                    <input type="tel" class="form-control" x-model="bookingForm.phone" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100" :disabled="isProcessing">
                                    <span x-show="!adminModeActive">שלח קוד אימות</span>
                                    <span x-show="adminModeActive">שריין כעת (מנהל - עוקף אימות)</span>
                                </button>
                            </form>
                        </div>

                        <div x-show="bookingStep === 2">
                            <p class="text-center">קוד אימות נשלח לכתובת המייל שלך.</p>
                            <div id="mojoauth-passwordless-form"></div>
                            <button @click="bookingStep = 1" class="btn btn-link w-100 mt-2">חזור לעריכת פרטים</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="adminModal" tabindex="-1" x-ref="adminModalElement">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header bg-light">
                        <h5 class="modal-title"><i class="fas fa-user-shield"></i> ניהול מערכת</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        
                        <div x-show="!adminModeActive">
                            <p class="text-muted mb-3">נא להזין סיסמת ניהול לעריכת הגדרות ומחיקת הזמנות.</p>
                            <input type="password" class="form-control mb-2" x-model="adminPassword" placeholder="סיסמה" @keyup.enter="checkAdmin()">
                            <button @click="checkAdmin()" class="btn btn-primary w-100">כניסה למערכת</button>
                        </div>

                        <div x-show="adminModeActive">
                            <div class="alert alert-success py-2"><i class="fas fa-check"></i> מצב מנהל פעיל</div>
                            
                            <h6 class="border-bottom pb-2 mb-3">הגדרות כלליות</h6>

                            <div class="mb-2">
                                <label class="form-label">כמות מחשבים כוללת:</label>
                                <input type="number" class="form-control" x-model.number="tempSettings.totalComputers" min="1">
                            </div>

                            <div class="mb-2">
                                <label class="form-label">כמה ימים לפתוח להזמנה:</label>
                                <input type="number" class="form-control" x-model.number="tempSettings.bookingWindowDays" min="1">
                            </div>

                            <div class="mb-4">
                                <label class="form-label">מקסימום הזמנות למשתמש בשבוע:</label>
                                <input type="number" class="form-control" x-model.number="tempSettings.maxBookingsPerWeek" min="1">
                            </div>

                            <div class="d-grid gap-2">
                                <button @click="saveSettings()" class="btn btn-success"><i class="fas fa-save"></i> שמור שינויים</button>
                                <button @click="resetSettings()" class="btn btn-outline-danger btn-sm"><i class="fas fa-history"></i> איפוס לברירת מחדל</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.mojoauth.com/js/mojoauth.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCKCHyKJTkXYtCS2p3J027jJfmI04npk7I",
            authDomain: "en-shemer-booking.firebaseapp.com",
            databaseURL: "https://en-shemer-booking-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "en-shemer-booking"
        };
        const MOJO_AUTH_KEY = "6383ede4-8f58-40f6-841a-df025cd261c3"; 

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        document.addEventListener('alpine:init', () => {
            Alpine.data('bookingApp', () => ({
                settings: { 
                    totalComputers: 10, 
                    bookingWindowDays: 14, 
                    maxBookingsPerWeek: 2 
                },
                tempSettings: {},
                bookings: [],
                isLoading: true,
                isProcessing: false,
                darkMode: false,
                selectedDate: '',
                availableDates: [],
                currentComputerId: null,
                bookingStep: 1,
                bookingForm: { name: '', email: '', phone: '' },
                
                // Admin State
                adminModeActive: false, // האם המשתמש במצב מנהל כרגע
                adminPassword: '',
                showAdminModal: false,

                async initApp() {
                    // Initialize MojoAuth
                    this.mojoauth = new MojoAuth(MOJO_AUTH_KEY, {
                        container: { id: "mojoauth-passwordless-form" },
                        source: [{ type: "email", feature: "otp" }],
                        language: "he"
                    });

                    this.generateDates();
                    
                    // Modals Initialization
                    this.bsBookingModal = new bootstrap.Modal(this.$refs.bookingModalElement);
                    this.bsAdminModal = new bootstrap.Modal(this.$refs.adminModalElement);

                    // Watchers
                    this.$watch('showAdminModal', val => {
                        if (val) {
                            // אם כבר מחובר כמנהל, טען את ההגדרות העדכניות לעריכה
                            if (this.adminModeActive) {
                                this.tempSettings = {...this.settings};
                            }
                            this.bsAdminModal.show();
                        } else {
                            this.bsAdminModal.hide();
                        }
                    });

                    // *** תיקון קריטי: סנכרון סגירת המודאל עם Alpine ***
                    this.$refs.adminModalElement.addEventListener('hidden.bs.modal', () => {
                        this.showAdminModal = false;
                        this.adminPassword = ''; // ניקוי שדה סיסמה ליתר ביטחון
                    });

                    this.listenToFirebase();
                },

                listenToFirebase() {
                    db.ref('settings').on('value', snap => {
                        if (snap.val()) {
                            this.settings = snap.val();
                            this.generateDates();
                        }
                    });

                    db.ref('bookings').on('value', snap => {
                        const data = snap.val() || {};
                        const all = [];
                        
                        const now = new Date();
                        const offset = now.getTimezoneOffset();
                        const localToday = new Date(now.getTime() - (offset * 60 * 1000)).toISOString().split('T')[0];

                        Object.keys(data).forEach(dateKey => {
                            if (dateKey < localToday) {
                                db.ref('bookings/' + dateKey).remove(); 
                            } else {
                                Object.keys(data[dateKey]).forEach(id => {
                                    all.push({ date: dateKey, computerId: parseInt(id), ...data[dateKey][id] });
                                });
                            }
                        });
                        this.bookings = all;
                        this.isLoading = false;
                    });
                },

                checkUserLimit() {
                    if (this.adminModeActive) return true;
                    
                    const email = this.bookingForm.email.trim();
                    if (!email) return true;

                    const current = new Date(this.selectedDate);
                    const day = current.getDay();
                    const firstDay = new Date(current);
                    firstDay.setDate(current.getDate() - day);
                    const lastDay = new Date(firstDay);
                    lastDay.setDate(firstDay.getDate() + 6);

                    const sStr = firstDay.toISOString().split('T')[0];
                    const eStr = lastDay.toISOString().split('T')[0];

                    const count = this.bookings.filter(b => 
                        b.email === email && 
                        b.date >= sStr && 
                        b.date <= eStr
                    ).length;

                    if (count >= this.settings.maxBookingsPerWeek) {
                        alert(`שגיאה: הגעת למקסימום ההזמנות המותר לשבוע זה (${this.settings.maxBookingsPerWeek}).`);
                        return false;
                    }
                    return true;
                },

                async moveToOtp() {
                    if (!this.checkUserLimit()) return;

                    if (this.adminModeActive) {
                        this.finalizeBooking(); // מנהל מדלג על OTP
                        return;
                    }
                    
                    this.isProcessing = true;
                    try {
                        this.bookingStep = 2;
                        const res = await this.mojoauth.signInWithEmailOTP(this.bookingForm.email);
                        if (res.authenticated) {
                            if (this.checkUserLimit()) {
                                this.finalizeBooking();
                            } else {
                                this.bsBookingModal.hide();
                            }
                        }
                    } catch (e) {
                        console.error(e);
                        alert("שגיאה בהתחברות. נסה שנית.");
                        this.bookingStep = 1;
                    } finally {
                        this.isProcessing = false;
                    }
                },

                finalizeBooking() {
                    const path = `bookings/${this.selectedDate}/${this.currentComputerId}`;
                    db.ref(path).set({
                        ...this.bookingForm,
                        timestamp: firebase.database.ServerValue.TIMESTAMP
                    }).then(() => {
                        this.bsBookingModal.hide();
                        alert("ההזמנה בוצעה בהצלחה!");
                    });
                },

                handleCardClick(id) {
                    if (this.isBooked(id)) return;
                    this.currentComputerId = id;
                    this.bookingStep = 1;
                    this.bsBookingModal.show();
                },

                isBooked(id) { return this.bookings.some(b => b.date === this.selectedDate && b.computerId === id); },
                getBookingDetails(id) { return this.bookings.find(b => b.date === this.selectedDate && b.computerId === id) || {}; },
                
                generateDates() {
                    this.availableDates = [];
                    const today = new Date();
                    const daysToShow = this.settings.bookingWindowDays || 14;

                    for (let i = 0; i < daysToShow; i++) {
                        let d = new Date(today);
                        d.setDate(today.getDate() + i);
                        
                        if(i===0 && !this.selectedDate) this.selectedDate = d.toISOString().split('T')[0];

                        this.availableDates.push({
                            value: d.toISOString().split('T')[0],
                            dayName: i === 0 ? 'היום' : (i === 1 ? 'מחר' : 'יום ' + ['א','ב','ג','ד','ה','ו','ש'][d.getDay()]),
                            formatted: d.getDate() + '/' + (d.getMonth() + 1)
                        });
                    }
                },

                getAvailabilityText() {
                    const booked = this.bookings.filter(b => b.date === this.selectedDate).length;
                    return (this.settings.totalComputers - booked) + ' פנויים מתוך ' + this.settings.totalComputers;
                },

                formatDate(iso) { return iso ? iso.split('-').reverse().join('/') : ''; },
                
                toggleDarkMode() { 
                     this.darkMode = !this.darkMode; 
                     document.documentElement.setAttribute('data-theme', this.darkMode ? 'dark' : 'light');
                },
                
                checkAdmin() {
                    if (this.adminPassword === '1234') { 
                        this.adminModeActive = true; // פעיל קבוע
                        this.tempSettings = {...this.settings}; // טעינת הגדרות
                    } else {
                        alert("סיסמה שגויה");
                    }
                },
                
                saveSettings() {
                    // ולידציה בסיסית
                    if(this.tempSettings.totalComputers < 1 || this.tempSettings.bookingWindowDays < 1) {
                        alert("נא להזין ערכים חיוביים בלבד");
                        return;
                    }
                    db.ref('settings').set(this.tempSettings).then(() => {
                        alert("ההגדרות נשמרו!");
                        this.showAdminModal = false; // סגירה אוטומטית אחרי שמירה
                    });
                },

                resetSettings() {
                    if(confirm("האם לאפס את ההגדרות לברירת המחדל?")) {
                        this.tempSettings = { totalComputers: 10, bookingWindowDays: 14, maxBookingsPerWeek: 2 };
                        this.saveSettings();
                    }
                },

                adminRemoveBooking(id) {
                    if(confirm("האם למחוק את ההזמנה לצמיתות?")) db.ref(`bookings/${this.selectedDate}/${id}`).remove();
                },
                
                startCancellation(id) {
                    alert("לביטול הזמנה נא לפנות למנהל המחשבים.");
                }
            }));
        });
    </script>
</body>
</html>

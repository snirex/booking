<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עין שמר - מערכת הזמנת מחשבים</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script src="https://cdn.mojoauth.com/js/mojoauth.min.js"></script>

    <style>
        :root {
            --bg-body: #f8f9fa;
            --text-main: #212529;
            --card-bg: #ffffff;
            --navbar-bg: #ffffff;
            --border-color: #dee2e6;
            --shadow: 0 .125rem .25rem rgba(0,0,0,.075);
            --modal-bg: #ffffff;
        }

        [data-theme="dark"] {
            --bg-body: #121212;
            --text-main: #e0e0e0;
            --card-bg: #1e1e1e;
            --navbar-bg: #1e1e1e;
            --border-color: #333;
            --shadow: 0 .125rem .25rem rgba(255,255,255,.05);
            --modal-bg: #2d2d2d;
        }

        body { background-color: var(--bg-body); color: var(--text-main); transition: background-color 0.3s, color 0.3s; }
        
        .navbar { background-color: var(--navbar-bg) !important; border-bottom: 1px solid var(--border-color); }
        .card { background-color: var(--card-bg); border-color: var(--border-color); color: var(--text-main); }
        .modal-content { background-color: var(--modal-bg); color: var(--text-main); }
        .modal-header, .modal-footer { border-color: var(--border-color); }
        .form-control { background-color: var(--bg-body); color: var(--text-main); border-color: var(--border-color); }
        .form-control:focus { background-color: var(--bg-body); color: var(--text-main); }

        .computer-card {
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border-radius: 12px;
        }
        .computer-card:hover { transform: translateY(-3px); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        .status-free { border-top: 5px solid #198754; }
        .status-taken { border-top: 5px solid #dc3545; opacity: 0.95; }
        [data-theme="dark"] .status-taken { background-color: #2c1517; }
        [data-theme="free"] .status-taken { background-color: #fff5f5; }

        .date-scroller {
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 10px;
            -webkit-overflow-scrolling: touch; 
        }
        .date-btn { display: inline-block; width: 100px; margin-left: 5px; }
        .date-btn.active { background-color: #0d6efd; color: white; border-color: #0d6efd; }
        
        .otp-input {
            letter-spacing: 1.5rem;
            font-weight: bold;
            text-align: center;
            font-size: 1.5rem;
        }
    </style>
</head>

<body>

    <div x-data="bookingApp()" x-init="initApp()" :class="{ 'dark-mode': darkMode }">

        <nav class="navbar navbar-expand-lg shadow-sm rounded mb-4 px-3">
            <a class="navbar-brand fw-bold" href="#" :class="darkMode ? 'text-light' : 'text-dark'">
                <i class="fas fa-laptop-code text-primary"></i> WorkStation Booker
            </a>
            
            <div class="ms-auto d-flex gap-2">
                <button @click="toggleDarkMode()" class="btn btn-sm btn-outline-secondary">
                    <i class="fas" :class="darkMode ? 'fa-sun' : 'fa-moon'"></i>
                </button>
                <button @click="showAdminModal = true" class="btn btn-outline-secondary btn-sm" :class="adminModeActive ? 'btn-warning text-dark' : ''">
                    <i class="fas fa-cog"></i> 
                    <span x-show="adminModeActive">מצב מנהל פעיל</span>
                    <span x-show="!adminModeActive">ניהול</span>
                </button>
            </div>
        </nav>

        <div class="container py-2">
            <div x-show="isLoading" class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2">טוען נתונים מהענן...</p>
            </div>

            <div x-show="!isLoading">
                <div class="mb-4">
                    <h5 class="mb-3">בחר תאריך להזמנה:</h5>
                    <div class="date-scroller">
                        <template x-for="dateObj in availableDates" :key="dateObj.value">
                            <button 
                                class="btn btn-outline-primary date-btn" 
                                :class="{ 'active': selectedDate === dateObj.value }"
                                @click="selectedDate = dateObj.value">
                                <div class="fw-bold" x-text="dateObj.dayName"></div>
                                <div class="small" x-text="dateObj.formatted"></div>
                            </button>
                        </template>
                    </div>
                </div>

                <div class="alert alert-info d-flex justify-content-between align-items-center">
                    <span>
                        <i class="fas fa-calendar-day"></i> לתאריך: <strong x-text="formatDate(selectedDate)"></strong>
                    </span>
                    <span class="badge bg-primary" x-text="getAvailabilityText()"></span>
                </div>

                <div class="row g-3">
                    <template x-for="i in settings.totalComputers" :key="i">
                        <div class="col-6 col-md-4 col-lg-3">
                            <div class="card computer-card h-100 shadow-sm"
                                 :class="isBooked(i) ? 'status-taken' : 'status-free'"
                                 @click="handleCardClick(i)">
                                 
                                <div class="card-body text-center">
                                    <h5 class="card-title mb-3">מחשב <span x-text="i"></span></h5>
                                    
                                    <template x-if="isBooked(i)">
                                        <div>
                                            <div class="text-danger mb-2"><i class="fas fa-lock"></i> תפוס</div>
                                            <div class="small text-muted" x-text="getBookingDetails(i).name"></div>
                                            
                                            <template x-if="adminModeActive">
                                                <button @click.stop="adminRemoveBooking(i)" class="btn btn-sm btn-danger mt-2 w-100">מחק (מנהל)</button>
                                            </template>

                                            <template x-if="!adminModeActive">
                                                <button @click.stop="startCancellation(i)" class="btn btn-sm btn-link text-danger mt-2" style="font-size:0.8rem">בטל הזמנה</button>
                                            </template>
                                        </div>
                                    </template>

                                    <template x-if="!isBooked(i)">
                                        <div>
                                            <div class="text-success mb-2"><i class="fas fa-check-circle"></i> פנוי</div>
                                            <button class="btn btn-sm btn-outline-success w-100">שריין עכשיו</button>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <div class="modal fade" id="bookingModal" tabindex="-1" aria-hidden="true" x-ref="bookingModalElement">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">שריין את מחשב מס' <span x-text="currentComputerId"></span></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        
                        <div x-show="bookingStep === 1">
                            <form @submit.prevent="moveToOtp()">
                                <div class="mb-3">
                                    <label class="form-label">שם מלא</label>
                                    <input type="text" class="form-control" x-model="bookingForm.name" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">דואר אלקטרוני</label>
                                    <input type="email" class="form-control" x-model="bookingForm.email" required placeholder="name@example.com">
                                    <div class="form-text">קוד אימות ישלח למייל זה.</div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">מספר טלפון</label>
                                    <input type="tel" class="form-control" x-model="bookingForm.phone" required>
                                </div>
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary" :disabled="isProcessing">
                                        <span x-show="isProcessing" class="spinner-border spinner-border-sm me-2"></span>
                                        <span x-show="!adminModeActive">שלח קוד אימות</span>
                                        <span x-show="adminModeActive">שריין מיד (מנהל)</span>
                                    </button>
                                </div>
                            </form>
                        </div>

                        <div x-show="bookingStep === 2">
                            <div class="text-center mb-4">
                                <i class="fas fa-shield-alt fa-3x text-success mb-3"></i>
                                <h5>אימות זהות</h5>
                                <p class="text-muted small">קוד אימות נשלח ל-<span class="fw-bold" x-text="bookingForm.email"></span></p>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label text-center w-100">הזן את קוד האימות</label>
                                <input type="text" class="form-control otp-input" 
                                       x-model="userEnteredOtp" placeholder="____" maxlength="6" autofocus>
                            </div>

                            <div class="d-grid gap-2">
                                <button @click="verifyBookingOtp()" class="btn btn-success btn-lg" :disabled="isProcessing">
                                    <span x-show="isProcessing" class="spinner-border spinner-border-sm me-2"></span>
                                    אמת והשלם הזמנה
                                </button>
                                <button @click="bookingStep = 1" class="btn btn-link text-secondary text-decoration-none small">תיקון מייל</button>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="cancelModal" tabindex="-1" x-ref="cancelModalElement">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">ביטול הזמנה</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p>הזן את המייל שאיתו נרשמת כדי לבטל.</p>
                        <div class="mb-3">
                            <input type="email" class="form-control" x-model="cancelEmail" placeholder="name@example.com">
                        </div>
                        <div class="d-grid">
                            <button @click="sendCancelOtp()" class="btn btn-danger">בטל הזמנה (שולח קוד אימות)</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="adminModal" tabindex="-1" x-ref="adminModalElement">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header bg-light">
                        <h5 class="modal-title text-dark">הגדרות ניהול</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" @click="showAdminModal = false"></button>
                    </div>
                    <div class="modal-body">
                        <div x-show="!isAdminAuthenticated">
                            <div class="mb-3">
                                <label class="text-dark">סיסמת ניהול</label>
                                <input type="password" class="form-control" x-model="adminPassword">
                            </div>
                            <button @click="checkAdmin()" class="btn btn-primary w-100">כנס</button>
                        </div>

                        <div x-show="isAdminAuthenticated">
                            <div class="form-check form-switch mb-4 p-3 border rounded bg-light-subtle">
                                <input class="form-check-input" type="checkbox" id="adminToggle" x-model="adminModeActive" style="float: right;">
                                <br/>
                                <label class="form-check-label fw-bold" for="adminToggle">הפעל "מצב מנהל"</label>
                                <div class="small text-muted">הוספה והסרה ללא אימות</div>
                            </div>
                            <hr>
                            <h6 class="text-dark">הגדרות כלליות (נשמרות בענן)</h6>
                            <div class="mb-3">
                                <label class="form-label">כמות מחשבים</label>
                                <input type="number" class="form-control" x-model.number="tempSettings.totalComputers">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">הגבלת הרשמות לשבוע</label>
                                <input type="number" class="form-control" x-model.number="tempSettings.maxBookingsPerWeek">
                            </div>
                            <button @click="saveSettings()" class="btn btn-primary w-100 mb-2">שמור הגדרות</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>

    <script>
        // --- 1. הגדרות FIREBASE ---
        // עליך להחליף את הערכים כאן בערכים מהמסוף של Firebase שלך
        // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCKCHyKJTkXYtCS2p3J027jJfmI04npk7I",
    authDomain: "en-shemer-booking.firebaseapp.com",
    databaseURL: "https://en-shemer-booking-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "en-shemer-booking",
    storageBucket: "en-shemer-booking.firebasestorage.app",
    messagingSenderId: "1023003700732",
    appId: "1:1023003700732:web:6f67a1c6388517930c1679"
  };
        const MOJO_AUTH = "8bfa0722-f07a-462d-8467-e305d7de95c3";
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        document.addEventListener('alpine:init', () => {
            Alpine.data('bookingApp', () => ({
                // Data
                settings: { totalComputers: 10, bookingWindowDays: 14, maxBookingsPerWeek: 2 },
                tempSettings: {}, 
                bookings: [], 
                
                // UI State
                isLoading: true,
                isProcessing: false,
                darkMode: false,
                selectedDate: '',
                availableDates: [],
                currentComputerId: null,
                
                // MojoAuth
                mojoauth: null,
                mojoauthState: null, // To store verification state

                // Forms
                bookingForm: { name: '', phone: '', email: '' },
                bookingStep: 1,
                cancelEmail: '',
                userEnteredOtp: '',

                // Admin
                showAdminModal: false,
                adminPassword: '',
                isAdminAuthenticated: false,
                adminModeActive: false,
                
                // Modals
                bsBookingModal: null,
                bsCancelModal: null,
                bsAdminModal: null,

                initApp() {
                    // 1. אתחול MojoAuth
                    // החלף כאן את המפתח במפתח שקיבלת מ-MojoAuth
                    this.mojoauth = new MojoAuth(MOJO_AUTH, {
                        source: [{ type: "email", feature: "otp" }],
                        language: "he"
                    });

                    // 2. בדיקת העדפות עיצוב
                    const savedTheme = localStorage.getItem('theme_preference');
                    if (savedTheme === 'dark') {
                        this.darkMode = true;
                        document.documentElement.setAttribute('data-theme', 'dark');
                    }

                    // 3. יצירת תאריכים
                    this.generateDates();
                    this.selectedDate = this.availableDates[0].value;

                    // 4. אתחול מודאלים
                    this.bsBookingModal = new bootstrap.Modal(this.$refs.bookingModalElement);
                    this.bsCancelModal = new bootstrap.Modal(this.$refs.cancelModalElement);
                    this.bsAdminModal = new bootstrap.Modal(this.$refs.adminModalElement);

                    this.$watch('showAdminModal', (val) => val ? this.bsAdminModal.show() : this.bsAdminModal.hide());
                    this.$refs.adminModalElement.addEventListener('hidden.bs.modal', () => this.showAdminModal = false);

                    // 5. האזנה לשינויים ב-Firebase (במקום LocalStorage)
                    this.listenToFirebase();
                },

                listenToFirebase() {
    // 1. האזנה להגדרות (כמות מחשבים וכו')
    db.ref('settings').on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
            this.settings = val;
            this.generateDates(); 
        }
    });

    // 2. פונקציית הניקוי והאזנה להזמנות
    db.ref('bookings').on('value', (snapshot) => {
        const data = snapshot.val() || {};
        let allBookings = [];
        
        // יצירת תאריך של היום בפורמט YYYY-MM-DD (לפי שעון מקומי)
        const now = new Date();
        const offset = now.getTimezoneOffset();
        const localToday = new Date(now.getTime() - (offset * 60 * 1000));
        const todayStr = localToday.toISOString().split('T')[0];

        console.log("Checking for old bookings to clean... Today is:", todayStr);

        Object.keys(data).forEach(dateKey => {
            // אם התאריך במערכת קטן מהתאריך של היום - מחק אותו
            if (dateKey < todayStr) {
                console.warn("Cleanup: Removing expired date:", dateKey);
                db.ref('bookings/' + dateKey).remove()
                    .then(() => console.log("Successfully deleted:", dateKey))
                    .catch(err => console.error("Cleanup error:", err));
            } else {
                // אם התאריך תקין, הוסף את ההזמנות שלו למערך התצוגה
                const computersInDate = data[dateKey];
                Object.keys(computersInDate).forEach(compId => {
                    allBookings.push({
                        date: dateKey,
                        computerId: parseInt(compId),
                        ...computersInDate[compId]
                    });
                });
            }
        });

        this.bookings = allBookings;
        this.isLoading = false;
    });
},

                // --- MojoAuth Logic ---

                async moveToOtp() {
                    // מנהל מדלג על אימות
                    if (this.adminModeActive) {
                        this.finalizeBooking();
                        return;
                    }

                    // בדיקת מגבלה שבועית
                    if (!this.checkWeeklyLimit(this.bookingForm.email)) {
                        alert(`שגיאה: הגעת למכסה של ${this.settings.maxBookingsPerWeek} מחשבים בשבוע זה.`);
                        return;
                    }

                    this.isProcessing = true;

                    try {
                        // שליחת קוד אמיתי דרך MojoAuth
                        const response = await this.mojoauth.signInWithEmailOTP(this.bookingForm.email);
                        // MojoAuth מחזיר State ID שצריך לשמור לאימות
                        this.mojoauthState = response; 
                        
                        this.bookingStep = 2;
                        this.userEnteredOtp = '';
                    } catch (error) {
                        console.error(error);
                        // Fallback לסימולציה אם אין מפתח (רק לצורך בדיקה, תמחק בפרודקשן)
                        if(error.errorCode === 'MA_SDK_KEY_NOT_FOUND') {
                            alert("שים לב: חסר מפתח MojoAuth בקוד. מפעיל סימולציה.");
                            this.bookingStep = 2;
                        } else {
                            alert("שגיאה בשליחת המייל: " + (error.message || error));
                        }
                    } finally {
                        this.isProcessing = false;
                    }
                },

                async verifyBookingOtp() {
                    this.isProcessing = true;
                    try {
                        // אימות הקוד מול MojoAuth
                        // הערה: אם אתה משתמש בגרסה החינמית הבסיסית ביותר, לפעמים ה-SDK דורש Widget.
                        // כאן אני משתמש ב-API של ה-SDK.
                        
                        // אם אנחנו במצב סימולציה (כי לא הגדרת מפתח עדיין)
                        /* await this.mojoauth.verifyEmailOTP(this.userEnteredOtp, this.mojoauthState);
                        */
                        
                        // בדיקת זמינות שוב (Race Condition)
                        const isTaken = await this.checkIfTakenRealtime(this.selectedDate, this.currentComputerId);
                        
                        if (isTaken) {
                            alert('אוי! בזמן שהמתנת, המחשב נתפס. נסה מחשב אחר.');
                            this.bsBookingModal.hide();
                        } else {
                            this.finalizeBooking();
                        }
                    } catch (error) {
                        alert("קוד שגוי או פג תוקף");
                    } finally {
                        this.isProcessing = false;
                    }
                },

                // בדיקה ישירה מול השרת לפני כתיבה
                async checkIfTakenRealtime(date, id) {
                    const snapshot = await db.ref(`bookings/${date}/${id}`).once('value');
                    return snapshot.exists();
                },

                finalizeBooking() {
                    // שמירה ל-Firebase
                    const path = `bookings/${this.selectedDate}/${this.currentComputerId}`;
                    db.ref(path).set({
                        name: this.bookingForm.name,
                        phone: this.bookingForm.phone,
                        email: this.bookingForm.email,
                        timestamp: firebase.database.ServerValue.TIMESTAMP
                    }).then(() => {
                        this.bsBookingModal.hide();
                        alert('ההזמנה נשמרה בענן בהצלחה!');
                    }).catch(err => {
                        alert('שגיאת תקשורת: ' + err.message);
                    });
                },

                // --- Cancellation ---

                startCancellation(computerId) {
                    // במערכת אמיתית, גם ביטול דורש אימות OTP.
                    // לצורך הפשטות כאן, נבקש רק מייל, אבל מומלץ להוסיף OTP גם פה.
                    this.currentComputerId = computerId;
                    this.cancelEmail = '';
                    this.bsCancelModal.show();
                },

                sendCancelOtp() {
                   // כאן צריך להיות אימות OTP כמו בהרשמה.
                   // בגרסה הזו אנו בודקים רק התאמה לנתונים במערכת
                   const booking = this.getBookingDetails(this.currentComputerId);
                   if(booking && booking.email === this.cancelEmail) {
                       this.performCancellation(this.currentComputerId);
                       this.bsCancelModal.hide();
                   } else {
                       alert('המייל אינו תואם להזמנה.');
                   }
                },

                adminRemoveBooking(computerId) {
                    if(confirm('למחוק לצמיתות?')) {
                        this.performCancellation(computerId);
                    }
                },

                performCancellation(computerId) {
                    const path = `bookings/${this.selectedDate}/${computerId}`;
                    db.ref(path).remove()
                        .then(() => alert('ההזמנה נמחקה.'))
                        .catch(err => alert('שגיאה במחיקה: ' + err));
                },

                // --- Admin Settings ---
                checkAdmin() {
                    // מומלץ לשמור סיסמה ב-Firebase ולא בקוד, אבל לפשטות:
                    if (this.adminPassword === 'admin') {
                        this.isAdminAuthenticated = true;
                        this.tempSettings = JSON.parse(JSON.stringify(this.settings));
                    } else {
                        alert('סיסמה שגויה');
                    }
                },

                saveSettings() {
                    // שמירת הגדרות בענן
                    db.ref('settings').set(this.tempSettings)
                        .then(() => {
                            this.showAdminModal = false;
                            this.bsAdminModal.hide();
                            alert('הגדרות עודכנו לכל המשתמשים!');
                        });
                },

                // --- Helpers (Same as before) ---
                toggleDarkMode() {
                    this.darkMode = !this.darkMode;
                    if(this.darkMode) document.documentElement.setAttribute('data-theme', 'dark');
                    else document.documentElement.removeAttribute('data-theme');
                    localStorage.setItem('theme_preference', this.darkMode ? 'dark' : 'light');
                },

                generateDates() {
                    this.availableDates = [];
                    const today = new Date();
                    const daysMap = ['א','ב','ג','ד','ה','ו','ש'];
                    for (let i = 0; i < this.settings.bookingWindowDays; i++) {
                        let d = new Date(today);
                        d.setDate(today.getDate() + i);
                        let isoDate = d.toISOString().split('T')[0];
                        let dayName = 'יום ' + daysMap[d.getDay()];
                        this.availableDates.push({
                            value: isoDate,
                            dayName: i === 0 ? 'היום' : (i === 1 ? 'מחר' : dayName),
                            formatted: d.getDate() + '/' + (d.getMonth() + 1)
                        });
                    }
                },

                handleCardClick(computerId) {
                    if (this.isLoading) return;
                    if (!this.isBooked(computerId)) {
                        this.currentComputerId = computerId;
                        this.bookingForm = { name: '', phone: '', email: '' };
                        this.bookingStep = 1;
                        this.userEnteredOtp = '';
                        this.bsBookingModal.show();
                    } 
                },

                isBooked(computerId) {
                    return this.bookings.some(b => b.date === this.selectedDate && b.computerId === computerId);
                },

                getBookingDetails(computerId) {
                    return this.bookings.find(b => b.date === this.selectedDate && b.computerId === computerId) || {};
                },

                getAvailabilityText() {
                    const bookedCount = this.bookings.filter(b => b.date === this.selectedDate).length;
                    return (this.settings.totalComputers - bookedCount) + ' פנויים מתוך ' + this.settings.totalComputers;
                },

                checkWeeklyLimit(email) {
                    const targetDate = new Date(this.selectedDate);
                    const bookingsThisWeek = this.bookings.filter(b => {
                        if (b.email !== email) return false;
                        const bDate = new Date(b.date);
                        return this.isSameWeek(targetDate, bDate);
                    });
                    return bookingsThisWeek.length < this.settings.maxBookingsPerWeek;
                },

                isSameWeek(d1, d2) {
                    const onejan = new Date(d1.getFullYear(), 0, 1);
                    const week1 = Math.ceil((((d1 - onejan) / 86400000) + onejan.getDay() + 1) / 7);
                    const onejan2 = new Date(d2.getFullYear(), 0, 1);
                    const week2 = Math.ceil((((d2 - onejan2) / 86400000) + onejan2.getDay() + 1) / 7);
                    return d1.getFullYear() === d2.getFullYear() && week1 === week2;
                },

                formatDate(isoDate) {
                    if (!isoDate) return '';
                    const parts = isoDate.split('-');
                    return parts[2] + '/' + parts[1] + '/' + parts[0];
                }
            }))
        });
    </script>
</body>
</html>
